<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>AI API Demo - 增强版</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 820px; margin: 40px auto; line-height: 1.6; }
    label { display: block; margin-top: 14px; font-weight: 600; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 8px; font-size:14px; }
    textarea { min-height: 100px; }
    .btn-group button { padding: 8px 16px; margin-top: 12px; margin-right:8px; cursor:pointer; }
    pre { background: #f5f5f5; padding: 16px; overflow: auto; white-space: pre-wrap; }
    .loading { color:#2176ff; }
    .err-401 { color:#d93025; font-weight:bold; }
    .err-422 { color:#f29900; }
    .err-net { color:#c41e3a; }
    .success { color:#00875a; }
  </style>
</head>
<body>
  <h1>AI API Demo（增强交互版）</h1>

  <label for="apiBase">API 地址</label>
  <input id="apiBase" value="http://127.0.0.1:8000" />

  <label for="token">本地测试 Token</label>
  <input id="token" type="password" placeholder="输入.env内COURSE_API_TOKEN的值" />

  <label for="question">问题</label>
  <textarea id="question">RAG是什么？</textarea>

  <div class="btn-group">
    <button onclick="sendRequest()">发送请求</button>
    <button onclick="clearAll()">清空输入与结果</button>
  </div>

  <div id="statusText"></div>
  <pre id="result"></pre>

  <script>
    const statusText = document.getElementById("statusText");
    const resultDom = document.getElementById("result");

    function clearAll(){
      document.getElementById("question").value = "";
      resultDom.textContent = "";
      statusText.textContent = "";
    }

    async function sendRequest() {
      const apiBase = document.getElementById("apiBase").value.replace(/\/$/, "");
      const token = document.getElementById("token").value.trim();
      const question = document.getElementById("question").value.trim();
      resultDom.textContent = "";

      if(!token){
        statusText.className = "err-401";
        statusText.textContent = "错误：请填写鉴权Token";
        return;
      }
      if(!question){
        statusText.className = "err-422";
        statusText.textContent = "错误：问题不能为空";
        return;
      }

      statusText.className = "loading";
      statusText.textContent = "请求中，正在调用后端服务...";
      try {
        const res = await fetch(`${apiBase}/api/ask`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ question })
        });

        const data = await res.json();
        // 分类处理状态码
        if(res.status === 401){
          statusText.className = "err-401";
          statusText.textContent = "鉴权失败(401)：Token错误或为空";
        }else if(res.status === 422){
          statusText.className = "err-422";
          statusText.textContent = "参数校验失败(422)：问题长度不合法";
        }else if(res.status === 200){
          statusText.className = "success";
          statusText.textContent = `请求成功 | Request-ID: ${data.request_id} | 耗时${data.elapsed_ms}ms | 使用模型:${data.model}`;
        }else{
          statusText.className = "err-net";
          statusText.textContent = `服务异常，状态码：${res.status}`;
        }
        resultDom.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        statusText.className = "err-net";
        statusText.textContent = `网络连接失败：${String(err)}，检查后端uvicorn是否启动`;
        resultDom.textContent = "";
      }
    }
  </script>
</body>
</html>
